name: Build Everything

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build the Entire Solution
      run: |
        msbuild uc_online2.sln /p:Configuration=Release /p:Platform=Win32
        msbuild uc_online2.sln /p:Configuration=Release /p:Platform=x64

    - name: Upload Everything
      uses: actions/upload-artifact@v4
      with:
        name: uc-online2-full-build
        path: |
          **/*.dll
          **/*.exe
